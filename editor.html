<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>PDF Reader с комментариями</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f0f2f5; overflow: hidden; }
        /* Верхняя панель */
        #topBar { background: #1976D2; color: white; padding: 8px; display: flex; align-items: center; gap: 10px; }
        #tabContainer { display: flex; flex: 1; gap: 5px; overflow-x: auto; white-space: nowrap; }
        .tab { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .tab.active { background: rgba(255,255,255,0.4); font-weight: bold; }
        .tab .close { margin-left: 5px; font-size: 16px; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(0,0,0,0.3); }
        .tab .close:active { background: rgba(0,0,0,0.5); }
        #openPdfBtn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #settingsBtn { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: auto; }
        /* Основная область с разделителем */
        #mainContainer { flex: 1; display: flex; overflow: hidden; }
        #pdfPanel { background: #e9ecef; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 10px; transition: width 0.05s; }
        #pdfContainer { transform-origin: 0 0; will-change: transform; padding-left: 5px; } /* небольшой отступ слева */
        .pdf-page-wrapper { position: relative; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); background: white; }
        .pdf-page-wrapper canvas { display: block; width: 100%; height: auto; }
        #resizer { width: 8px; background: #aaa; cursor: col-resize; transition: background 0.2s; }
        #resizer:hover, #resizer:active { background: #1976D2; }
        #commentsPanel { background: white; overflow: hidden; display: flex; flex-direction: column; border-left: 1px solid #ccc; }
        .comments-range { display: flex; padding: 10px; gap: 5px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
        .comments-range input { width: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 16px; }
        .comments-range span { align-self: center; }
        #commentsText { flex: 1; width: 100%; padding: 15px; font-size: 16px; border: none; resize: none; outline: none; }
        #pageIndicator { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 12px 24px; border-radius: 40px; font-weight: bold; z-index: 100; pointer-events: none; }
        /* Модальное окно настроек */
        #settingsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 10px; padding: 20px; max-width: 500px; width: 90%; max-height: 80%; overflow: auto; }
        .modal-content h3 { margin-bottom: 15px; }
        .storage-info { margin-bottom: 15px; font-weight: bold; }
        .file-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        .file-list-item button { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .hidden { display: none; }
        #fileInput { display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body>
    <!-- Верхняя панель -->
    <div id="topBar">
        <div id="tabContainer"></div>
        <button id="openPdfBtn" title="Открыть PDF">➕</button>
        <button id="settingsBtn" title="Настройки">⚙️</button>
    </div>

    <!-- Основная область -->
    <div id="mainContainer">
        <div id="pdfPanel">
            <div id="pdfContainer"></div>
        </div>
        <div id="resizer"></div>
        <div id="commentsPanel">
            <div class="comments-range">
                <input type="number" id="commentFrom" min="1" value="1">
                <span>—</span>
                <input type="number" id="commentTo" min="1" value="1">
            </div>
            <textarea id="commentsText" placeholder="Комментарий для диапазона страниц..."></textarea>
        </div>
    </div>

    <!-- Плавающий индикатор страницы -->
    <div id="pageIndicator">Стр. 1</div>

    <!-- Модальное окно настроек -->
    <div id="settingsModal">
        <div class="modal-content">
            <h3>Настройки хранилища</h3>
            <div class="storage-info" id="storageSize">Загружено...</div>
            <h4>Файлы с комментариями:</h4>
            <div id="fileList"></div>
            <button id="closeModalBtn" style="margin-top:15px; padding:8px 16px;">Закрыть</button>
        </div>
    </div>

    <!-- Скрытый input для выбора PDF -->
    <input type="file" id="fileInput" accept=".pdf,application/pdf" />

    <script>
        (function() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

            // ---------- Состояние ----------
            const documents = [];               // массив открытых документов { id, name, pages, comments }
            let activeDocIndex = -1;
            let scale = 1;                       // текущий масштаб
            let initialDistance = 0, initialScale = 1;

            // Элементы
            const tabContainer = document.getElementById('tabContainer');
            const pdfContainer = document.getElementById('pdfContainer');
            const pageIndicator = document.getElementById('pageIndicator');
            const commentsText = document.getElementById('commentsText');
            const commentFrom = document.getElementById('commentFrom');
            const commentTo = document.getElementById('commentTo');
            const resizer = document.getElementById('resizer');
            const pdfPanel = document.getElementById('pdfPanel');
            const commentsPanel = document.getElementById('commentsPanel');
            const openPdfBtn = document.getElementById('openPdfBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const fileInput = document.getElementById('fileInput');
            const settingsModal = document.getElementById('settingsModal');
            const storageSize = document.getElementById('storageSize');
            const fileList = document.getElementById('fileList');
            const closeModalBtn = document.getElementById('closeModalBtn');

            // ---------- Класс документа ----------
            class PDFDocument {
                constructor(file, pages) {
                    this.id = file.name + '_' + file.lastModified + '_' + file.size; // уникальный идентификатор
                    this.name = file.name;
                    this.pages = pages;           // массив { dataURL, width, height }
                    this.comments = [];            // загружаются из localStorage позже
                }

                // Получить комментарий для страницы
                getCommentForPage(page) {
                    const c = this.comments.find(c => c.startPage <= page && c.endPage >= page);
                    return c ? c.text : '';
                }

                // Установить комментарий (заменяет существующий для этого диапазона)
                setComment(start, end, text) {
                    // Удаляем все комментарии, пересекающие этот диапазон (для простоты удалим все с пересечением)
                    this.comments = this.comments.filter(c => !(c.startPage <= end && c.endPage >= start));
                    if (text.trim() !== '') {
                        this.comments.push({ startPage: start, endPage: end, text });
                    }
                    this.saveToLocalStorage();
                }

                // Сохранить комментарии в localStorage
                saveToLocalStorage() {
                    const key = 'pdf_comments_' + this.id;
                    localStorage.setItem(key, JSON.stringify(this.comments));
                }

                // Загрузить комментарии из localStorage
                loadFromLocalStorage() {
                    const key = 'pdf_comments_' + this.id;
                    const saved = localStorage.getItem(key);
                    if (saved) {
                        try {
                            this.comments = JSON.parse(saved);
                        } catch (e) {
                            this.comments = [];
                        }
                    } else {
                        this.comments = [];
                    }
                }
            }

            // ---------- Работа с вкладками ----------
            function renderTabs() {
                tabContainer.innerHTML = '';
                documents.forEach((doc, i) => {
                    const tab = document.createElement('span');
                    tab.className = 'tab' + (i === activeDocIndex ? ' active' : '');
                    tab.textContent = doc.name;
                    tab.dataset.index = i;
                    tab.addEventListener('click', (e) => {
                        if (e.target.classList.contains('close')) return;
                        switchToDocument(parseInt(e.currentTarget.dataset.index));
                    });
                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'close';
                    closeBtn.innerHTML = '✕';
                    closeBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        closeDocument(i);
                    });
                    tab.appendChild(closeBtn);
                    tabContainer.appendChild(tab);
                });
            }

            function closeDocument(index) {
                if (documents.length === 0) return;
                // Перед закрытием сохраняем текущий комментарий
                if (activeDocIndex === index) {
                    saveCurrentComment();
                }
                documents.splice(index, 1);
                if (documents.length === 0) {
                    activeDocIndex = -1;
                    pdfContainer.innerHTML = '';
                    pageIndicator.style.display = 'none';
                } else {
                    if (index <= activeDocIndex) activeDocIndex = Math.max(0, activeDocIndex-1);
                    switchToDocument(activeDocIndex);
                }
                renderTabs();
            }

            function switchToDocument(index) {
                if (index === activeDocIndex || index < 0 || index >= documents.length) return;
                if (activeDocIndex !== -1) {
                    saveCurrentComment();
                }
                activeDocIndex = index;
                renderTabs();
                loadDocumentToView(documents[activeDocIndex]);
            }

            function saveCurrentComment() {
                if (activeDocIndex === -1) return;
                const doc = documents[activeDocIndex];
                const wrappers = document.querySelectorAll('.pdf-page-wrapper');
                let visiblePage = getVisiblePage();
                if (visiblePage === -1) visiblePage = 1;
                const from = parseInt(commentFrom.value) || visiblePage;
                const to = parseInt(commentTo.value) || visiblePage;
                doc.setComment(from, to, commentsText.value);
            }

            function getVisiblePage() {
                const wrappers = document.querySelectorAll('.pdf-page-wrapper');
                if (wrappers.length === 0) return -1;
                const containerRect = pdfPanel.getBoundingClientRect();
                for (let i = 0; i < wrappers.length; i++) {
                    const rect = wrappers[i].getBoundingClientRect();
                    if (rect.top < containerRect.bottom && rect.bottom > containerRect.top) {
                        return i+1;
                    }
                }
                return 1;
            }

            function loadDocumentToView(doc) {
                pdfContainer.innerHTML = '';
                doc.pages.forEach((pageData, idx) => {
                    const pageNum = idx+1;
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    wrapper.style.width = pageData.width + 'px';
                    wrapper.style.height = pageData.height + 'px';

                    const canvas = document.createElement('canvas');
                    canvas.width = pageData.width;
                    canvas.height = pageData.height;
                    wrapper.appendChild(canvas);

                    pdfContainer.appendChild(wrapper);

                    const img = new Image();
                    img.onload = () => {
                        canvas.getContext('2d').drawImage(img, 0, 0);
                    };
                    img.src = pageData.dataURL;
                });

                // Сброс масштаба
                scale = 1;
                pdfContainer.style.transform = `scale(${scale})`;

                // Загружаем комментарии для этого документа
                doc.loadFromLocalStorage();

                // Устанавливаем комментарии для первой страницы
                updateCommentUIForPage(1);
                pageIndicator.style.display = 'block';
                pageIndicator.textContent = 'Стр. 1';
            }

            function updateCommentUIForPage(page) {
                if (activeDocIndex === -1) return;
                const doc = documents[activeDocIndex];
                const comment = doc.getCommentForPage(page);
                commentsText.value = comment;
                const c = doc.comments.find(c => c.startPage <= page && c.endPage >= page);
                if (c) {
                    commentFrom.value = c.startPage;
                    commentTo.value = c.endPage;
                } else {
                    commentFrom.value = page;
                    commentTo.value = page;
                }
            }

            // ---------- Открытие PDF ----------
            openPdfBtn.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const typedarray = new Uint8Array(ev.target.result);
                    pdfjsLib.getDocument({ data: typedarray }).promise.then(pdfDoc => {
                        const numPages = pdfDoc.numPages;
                        const pages = [];
                        let completed = 0;

                        for (let i = 1; i <= numPages; i++) {
                            renderPageToDataURL(pdfDoc, i, (dataURL, width, height) => {
                                pages.push({ dataURL, width, height });
                                completed++;
                                if (completed === numPages) {
                                    // Создаём новый документ
                                    const doc = new PDFDocument(file, pages);
                                    documents.push(doc);
                                    renderTabs();
                                    switchToDocument(documents.length-1);
                                }
                            });
                        }
                    }).catch(err => alert('Ошибка загрузки PDF: ' + err.message));
                };
                reader.readAsArrayBuffer(file);
                fileInput.value = '';
            });

            function renderPageToDataURL(pdfDoc, pageNum, callback) {
                pdfDoc.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1.5 }); // чуть выше качество
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise.then(() => {
                        callback(canvas.toDataURL('image/png'), viewport.width, viewport.height);
                    });
                });
            }

            // ---------- Комментарии (автосохранение при изменении) ----------
            function onCommentChange() {
                if (activeDocIndex === -1) return;
                const page = getVisiblePage();
                if (page === -1) return;
                const from = parseInt(commentFrom.value) || page;
                const to = parseInt(commentTo.value) || page;
                const doc = documents[activeDocIndex];
                doc.setComment(from, to, commentsText.value);
            }

            commentsText.addEventListener('input', onCommentChange);
            commentFrom.addEventListener('change', onCommentChange);
            commentTo.addEventListener('change', onCommentChange);

            // ---------- Обновление индикатора страницы при прокрутке ----------
            pdfPanel.addEventListener('scroll', () => {
                const page = getVisiblePage();
                if (page !== -1) {
                    pageIndicator.textContent = `Стр. ${page}`;
                    if (activeDocIndex !== -1) {
                        const doc = documents[activeDocIndex];
                        const comment = doc.getCommentForPage(page);
                        commentsText.value = comment;
                        const c = doc.comments.find(c => c.startPage <= page && c.endPage >= page);
                        if (c) {
                            commentFrom.value = c.startPage;
                            commentTo.value = c.endPage;
                        } else {
                            commentFrom.value = page;
                            commentTo.value = page;
                        }
                    }
                }
            });

            // ---------- Масштабирование жестами ----------
            pdfContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialDistance = Math.sqrt(dx*dx + dy*dy);
                    initialScale = scale;
                }
            });
            pdfContainer.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx*dx + dy*dy);
                    let newScale = initialScale * (distance / initialDistance);
                    newScale = Math.min(3, Math.max(0.5, newScale));
                    scale = newScale;
                    pdfContainer.style.transform = `scale(${scale})`;
                }
            });

            // ---------- Изменение размера окон ----------
            let isResizing = false;
            resizer.addEventListener('mousedown', () => { isResizing = true; });
            resizer.addEventListener('touchstart', () => { isResizing = true; });
            window.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const containerRect = mainContainer.getBoundingClientRect();
                let newWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
                if (newWidth < 20) newWidth = 20;
                if (newWidth > 80) newWidth = 80;
                pdfPanel.style.width = newWidth + '%';
                commentsPanel.style.width = (100 - newWidth) + '%';
            });
            window.addEventListener('touchmove', (e) => {
                if (!isResizing) return;
                const containerRect = mainContainer.getBoundingClientRect();
                let newWidth = ((e.touches[0].clientX - containerRect.left) / containerRect.width) * 100;
                if (newWidth < 20) newWidth = 20;
                if (newWidth > 80) newWidth = 80;
                pdfPanel.style.width = newWidth + '%';
                commentsPanel.style.width = (100 - newWidth) + '%';
            });
            window.addEventListener('mouseup', () => { isResizing = false; });
            window.addEventListener('touchend', () => { isResizing = false; });

            // ---------- Настройки (модальное окно) ----------
            function updateStorageInfo() {
                // Размер localStorage
                let total = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += localStorage[key].length * 2; // приблизительно в байтах (UTF-16)
                    }
                }
                const sizeKB = (total / 1024).toFixed(2);
                const sizeMB = (total / (1024*1024)).toFixed(2);
                storageSize.textContent = `Занято: ${sizeKB} KB (${sizeMB} MB)`;

                // Список файлов с комментариями
                const fileSet = new Set();
                for (let key in localStorage) {
                    if (key.startsWith('pdf_comments_')) {
                        const docId = key.substring(13);
                        // Ищем в открытых документах
                        const doc = documents.find(d => d.id === docId);
                        if (doc) {
                            fileSet.add(doc.name);
                        } else {
                            // Можно показать ID, но для красоты попробуем извлечь имя из localStorage? Сложно, просто покажем ID
                            fileSet.add(docId.substring(0, 20) + '...');
                        }
                    }
                }
                fileList.innerHTML = '';
                Array.from(fileSet).forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'file-list-item';
                    div.innerHTML = `<span>${name}</span><button data-name="${name}">Удалить</button>`;
                    div.querySelector('button').addEventListener('click', (e) => {
                        const fname = e.target.dataset.name;
                        // Удаляем все комментарии для этого имени (не идеально, но для демо)
                        for (let key in localStorage) {
                            if (key.startsWith('pdf_comments_')) {
                                // Простейший поиск: удаляем ключи, которые содержат имя файла
                                if (key.includes(fname)) {
                                    localStorage.removeItem(key);
                                }
                            }
                        }
                        updateStorageInfo();
                    });
                    fileList.appendChild(div);
                });
            }

            settingsBtn.addEventListener('click', () => {
                updateStorageInfo();
                settingsModal.style.display = 'flex';
            });

            closeModalBtn.addEventListener('click', () => {
                settingsModal.style.display = 'none';
            });

            window.addEventListener('click', (e) => {
                if (e.target === settingsModal) {
                    settingsModal.style.display = 'none';
                }
            });

            // Инициализация
            pageIndicator.style.display = 'none';
        })();
    </script>
</body>
</html>
