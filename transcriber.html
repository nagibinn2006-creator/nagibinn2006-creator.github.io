<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4A → Текст (Whisper WASM)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; background: #f8f9fa; }
        h1 { color: #007aff; text-align: center; }
        input, button { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background: #007aff; color: white; border: none; cursor: pointer; }
        button:disabled { background: #ccc; }
        #status, #progress { text-align: center; margin: 10px 0; padding: 10px; background: #e9ecef; border-radius: 5px; }
        #result { margin-top: 20px; padding: 20px; background: white; border: 1px solid #ddd; border-radius: 8px; min-height: 120px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🎤 M4A в текст</h1>
    <p>Загрузите модель <a href="models/" target="_blank">здесь</a> (ggml-base.en.bin или ggml-base-ru.bin), затем M4A файл.</p>
    
    <input type="file" id="audioFile" accept="audio/m4a,audio/mp4,audio/wav">
    <button id="transcribeBtn" disabled>Транскрибировать (Рус/Eng)</button>
    
    <div id="progress" style="display:none;">Обработка: <span id="prog">0%</span></div>
    <div id="status">Выберите модель и аудио</div>
    <div id="result">Результат...</div>

    <!-- Вставьте whisper.wasm скрипты (скачайте из демо) -->
    <script src="https://unpkg.com/@tensorflow/tfjs"></script> <!-- Если нужно для аудио -->
    <!-- Или локально: <script src="whisper.js"></script> из https://github.com/timur00kh/whisper.wasm -->

    <script>
        const Whisper = {}; // Placeholder для whisper.wasm API
        // Загрузка готового whisper.wasm (адаптируйте)
        // В репо добавьте whisper.wasm файлы из https://github.com/timur00kh/whisper.wasm/tree/main/demo

        let audioCtx = null;
        const audioFile = document.getElementById('audioFile');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const prog = document.getElementById('prog');
        const result = document.getElementById('result');

        // Декод M4A в 16kHz PCM
        async function m4aToPCM(file) {
            if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 16000 });
            const buffer = await file.arrayBuffer();
            const audioBuf = await audioCtx.decodeAudioData(buffer);
            const pcm = audioCtx.createBuffer(1, audioBuf.length, 16000);
            const channelData = audioBuf.getChannelData(0);
            pcm.copyToChannel(channelData, 0);
            return pcm.getChannelData(0);
        }

        // Транскрипция (пример API whisper.cpp wasm)
        async function transcribe(pcm) {
            // Адаптируйте под ваш WASM:
            // const ctx = Whisper.create_context('models/ggml-base.bin');
            // const res = Whisper.full(ctx, pcm);
            // return Whisper.full_get_segment(ctx, 0);
            
            // Placeholder - замените на реальный вызов
            status.textContent = 'Транскрипция... (замените на whisper.transcribe(pcm, {language: "ru"}))';
            await new Promise(r => setTimeout(r, 2000)); // Симуляция
            return 'Пример текста: "Это распознанный русский с английским". Точный текст от Whisper.';
        }

        audioFile.onchange = () => {
            transcribeBtn.disabled = !audioFile.files[0];
        };

        transcribeBtn.onclick = async () => {
            const file = audioFile.files[0];
            if (!file) return;
            
            transcribeBtn.disabled = true;
            status.textContent = 'Декодирование M4A...';
            progress.style.display = 'block';

            try {
                const pcm = await m4aToPCM(file);
                prog.textContent = '50%';
                const text = await transcribe(pcm);
                result.textContent = text;
                status.textContent = 'Готово!';
            } catch (e) {
                status.textContent = `Ошибка: ${e.message}`;
            }
            progress.style.display = 'none';
            transcribeBtn.disabled = false;
        };
    </script>
</body>
</html>
